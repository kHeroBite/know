[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "know-ops"
version = "0.1.0"
description = "지식팀 Ops 자동화 CLI 도구"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic-settings>=2.0",
    "paramiko>=3.0",
    "pandas>=2.0",
    "rich>=13.0",
]

[project.scripts]
know = "know.cli:메인"

[tool.hatch.build.targets.wheel]
packages = ["src/know"]
