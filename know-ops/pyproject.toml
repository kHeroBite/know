[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "know-ops"
version = "0.1.0"
description = "지식팀 Ops 자동화 CLI 도구"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1",
    "pydantic-settings>=2.0",
    "paramiko>=3.0",
    "pandas>=2.0",
    "rich>=13.0",
]

[project.scripts]
know = "know.cli:메인"

[tool.setuptools.packages.find]
where = ["src"]
